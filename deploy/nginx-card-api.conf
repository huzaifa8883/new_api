# OPTIONAL. Save as /etc/nginx/sites-available/card-api.conf  (NEW file, existing sites untouched)
# Not needed: the API is used directly at http://72.61.146.237:5005 (this file is optional)
# If you use this, change --host 0.0.0.0 to --host 127.0.0.1 in the service file
# and do NOT open 5005 in the firewall.
server {
    listen 80;
    server_name api.yourdomain.com;   # <-- your own (sub)domain, must not match an existing server_name

    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
